[package]
name = "nulls-dj-utilities"
version = "1.0.0"
description = "null's DJ Utilities. Sync rekordbox now playing metadata to VRChat OSC and OBS browser sources."
authors = ["null_base"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "nulls_dj_utilities_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
