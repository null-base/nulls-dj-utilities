name: 🪩 Build Desktop App

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact_name: nulls-dj-utilities-windows-x64

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nulls-dj-utilities-macos-arm64

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nulls-dj-utilities-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - name: Show tool versions
        run: |
          mise --version
          bun --version
          rustc --version
          cargo --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows
        if: runner.os == 'Windows'
        run: bun run build

      - name: Build macOS
        if: runner.os == 'macOS'
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
