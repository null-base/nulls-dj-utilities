name: Build Desktop App

on:
  workflow_run:
    workflows:
      - Analyze and Test
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact_name: nulls-dj-utilities-windows-x64

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: nulls-dj-utilities-macos-arm64

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nulls-dj-utilities-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows
        if: runner.os == 'Windows'
        run: bun run build

      - name: Build macOS
        if: runner.os == 'macOS'
        run: bun run build --target ${{ matrix.target }}

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
